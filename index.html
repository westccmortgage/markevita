<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Luxury websites and strategic marketing that elevate brands and drive results." />
  <title>MARKEVITA — We Create Digital Masterpieces</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ── RESET & BASE ───────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ivory:       #F7F4EF;
      --warm-white:  #FDFAF6;
      --charcoal:    #1C1C1C;
      --mid-gray:    #5A5A5A;
      --gold:        #B8965A;
      --gold-light:  #D4B07A;
      --border-gold: rgba(184,150,90,0.25);

      --serif: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
      --sans:  'Inter', system-ui, -apple-system, sans-serif;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      background: var(--warm-white);
      color: var(--charcoal);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.6;
    }
    img { display: block; max-width: 100%; }
    button { cursor: pointer; background: none; border: none; font-family: var(--sans); }
    a { text-decoration: none; color: inherit; }

    /* ── HEADER (stays across the top) ──────────────────── */
    #site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: 72px;
      display: flex;
      align-items: center;
      transition: background 0.3s, border-color 0.3s, backdrop-filter 0.3s;
      border-bottom: 1px solid transparent;
    }
    #site-header.scrolled {
      background: rgba(253,250,246,0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom-color: var(--border-gold);
    }
    .header-inner {
      width: 100%;
      max-width: 1380px;
      margin: 0 auto;
      padding: 0 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 0.85rem; }
    .logo-mark { width: 34px; height: 34px; flex-shrink: 0; }
    .logo-wordmark {
      font-family: var(--sans);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--charcoal);
    }
    .main-nav { display: flex; align-items: center; gap: 2.5rem; }
    .main-nav a {
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mid-gray);
      transition: color 0.2s;
    }
    .main-nav a:hover { color: var(--charcoal); }
    .nav-cta {
      padding: 0.55rem 1.35rem;
      border: 1px solid var(--charcoal);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--charcoal) !important;
      transition: background 0.2s, color 0.2s !important;
    }
    .nav-cta:hover { background: var(--charcoal); color: var(--warm-white) !important; }

    /* ── HERO — FULL-BLEED VIDEO ────────────────────────────
       The video fills the entire hero edge to edge (object-fit:
       cover). The header and the left-side text sit ABOVE it.
       A soft warm scrim sits behind the text only — the rest of
       the video is never darkened.
    ───────────────────────────────────────────────────────── */
    #hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 640px;
      overflow: hidden;
      background: var(--ivory); /* fallback before the video paints */
    }

    /* z:1 — video, behind everything */
    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }

    /* z:2 — warm scrim behind the TEXT only (left side), fades out */
    .hero-scrim {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(
        to right,
        rgba(247,244,239,0.94) 0%,
        rgba(247,244,239,0.82) 20%,
        rgba(247,244,239,0.45) 40%,
        rgba(247,244,239,0.10) 56%,
        rgba(247,244,239,0) 70%
      );
    }

    /* z:3 — text content overlay */
    .hero-content {
      position: relative;
      z-index: 3;
      height: 100%;
      max-width: 1380px;
      margin: 0 auto;
      padding: 0 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    .hero-eyebrow {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.6rem;
    }
    .hero-eyebrow::before {
      content: "";
      width: 36px;
      height: 1px;
      background: var(--gold);
      display: inline-block;
    }

    .hero-headline {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(2.8rem, 6.2vw, 5.6rem);
      line-height: 1.02;
      letter-spacing: -0.01em;
      color: var(--charcoal);
      margin-bottom: 1.8rem;
    }
    .hero-headline .gold-italic {
      font-style: italic;
      color: var(--gold);
    }

    .hero-sub {
      font-size: clamp(1rem, 1.3vw, 1.18rem);
      font-weight: 300;
      line-height: 1.6;
      color: var(--mid-gray);
      max-width: 30rem;
      margin-bottom: 2.6rem;
    }

    .hero-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.85rem;
      padding: 1rem 2.1rem;
      background: var(--charcoal);
      color: var(--warm-white);
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: background 0.25s, transform 0.25s;
    }
    .hero-btn:hover { background: #000; transform: translateY(-2px); }
    .hero-btn svg { transition: transform 0.25s; }
    .hero-btn:hover svg { transform: translateX(4px); }

    /* Sound enabler — shown ONLY if the browser blocks sound-on autoplay.
       Tapping it starts the video with audio. */
    .sound-hint {
      position: absolute;
      z-index: 4;
      right: 2rem;
      bottom: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1.2rem;
      background: rgba(28,28,28,0.82);
      color: var(--warm-white);
      border: 1px solid var(--border-gold);
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .sound-hint[hidden] { display: none; }

    /* ── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 860px) {
      .main-nav { gap: 1.25rem; }
      .main-nav a:not(.nav-cta) { display: none; }
      .hero-scrim {
        background: linear-gradient(
          to right,
          rgba(247,244,239,0.95) 0%,
          rgba(247,244,239,0.80) 45%,
          rgba(247,244,239,0.30) 80%,
          rgba(247,244,239,0) 100%
        );
      }
    }
    @media (max-width: 560px) {
      .header-inner, .hero-content { padding: 0 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- ── HEADER ───────────────────────────────────────── -->
  <header id="site-header">
    <div class="header-inner">
      <a class="logo" href="#">
        <svg class="logo-mark" width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="34" height="34" fill="#1C1C1C"/>
          <path d="M7 25V9L17 19L27 9V25" stroke="#B8965A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <span class="logo-wordmark">MARKEVITA</span>
      </a>
      <nav class="main-nav">
        <a href="#">Services</a>
        <a href="#">Work</a>
        <a href="#">About</a>
        <a href="#">Journal</a>
        <a href="#" class="nav-cta">Let's Talk</a>
      </nav>
    </div>
  </header>

  <!-- ── HERO ─────────────────────────────────────────── -->
  <section id="hero">

    <!-- Full-bleed video. Plays once with sound; holds its final frame.
         No loop attribute. Not muted. -->
    <video
      id="hero-video"
      class="hero-video"
      src="/videos/markevita.mov"
      autoplay
      playsinline
      preload="auto"
    ></video>

    <!-- Warm scrim behind the text only -->
    <div class="hero-scrim"></div>

    <!-- Left-side text overlay -->
    <div class="hero-content">
      <p class="hero-eyebrow">Premium Digital Agency</p>
      <h1 class="hero-headline">
        We create<br>
        <span class="gold-italic">digital</span><br>
        masterpieces.
      </h1>
      <p class="hero-sub">
        Luxury websites and strategic marketing that elevate brands and drive results.
      </p>
      <a class="hero-btn" href="#">
        Discover Our Work
        <svg width="16" height="10" viewBox="0 0 16 10" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 5h13M10 1l4 4-4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>

    <!-- Sound enabler (only appears if sound-on autoplay is blocked) -->
    <button class="sound-hint" id="sound-hint" hidden>🔊 Tap for sound</button>

  </section>

  <script>
    /* ── Hero video: play ONCE with sound, hold the final frame ── */
    const heroVideo = document.getElementById('hero-video');
    const soundHint = document.getElementById('sound-hint');

    if (heroVideo) {
      // Sound is always on — never muted.
      heroVideo.muted = false;
      heroVideo.removeAttribute('loop'); // explicitly never loop
      heroVideo.volume = 1.0;

      let started = false;
      function startWithSound() {
        if (started) return;
        const p = heroVideo.play();
        if (p && typeof p.then === 'function') {
          p.then(() => {
            started = true;
            if (soundHint) soundHint.hidden = true;
            removeGestureListeners();
          }).catch(() => {
            // Browser blocked sound-on autoplay → offer a one-tap start.
            if (soundHint) soundHint.hidden = false;
          });
        }
      }

      // First user gesture anywhere starts playback with sound.
      function onGesture() { startWithSound(); }
      function removeGestureListeners() {
        document.removeEventListener('pointerdown', onGesture);
        document.removeEventListener('keydown', onGesture);
        document.removeEventListener('touchstart', onGesture);
      }
      document.addEventListener('pointerdown', onGesture, { passive: true });
      document.addEventListener('keydown', onGesture);
      document.addEventListener('touchstart', onGesture, { passive: true });
      if (soundHint) soundHint.addEventListener('click', startWithSound);

      // Attempt sound-on autoplay immediately.
      startWithSound();

      // When it ends: do nothing. No reset, no replay → final frame stays.
      heroVideo.addEventListener('ended', () => {
        removeGestureListeners();
      });
    }

    /* ── Sticky header tint on scroll ── */
    const header = document.getElementById('site-header');
    if (header) {
      window.addEventListener('scroll', () => {
        header.classList.toggle('scrolled', window.scrollY > 20);
      }, { passive: true });
    }
  </script>

</body>
</html>
