name: Production regression tests

on:
  push:
    branches: [claude/series-studio]
    paths: ['pipeline/**', 'studio/**', '.github/workflows/production-tests.yml']
  pull_request:
    paths: ['pipeline/**', 'studio/**', '.github/workflows/production-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            studio/requirements.txt
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r pipeline/requirements.txt -r studio/requirements.txt pytest
      - name: Check production startup in an isolated process
        run: python studio/check_startup.py
      - name: Validate the full production and recovery flow without credentials
        env:
          PYTHONPATH: pipeline:studio
          STUDIO_STORE: local
          STUDIO_ALLOW_PAID: 'false'
          PIPELINE_ALLOW_PAID: 'false'
        run: python -m pytest -q pipeline/tests studio/tests
